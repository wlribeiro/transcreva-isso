<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcrição de Vídeos do YouTube - Obtenha Transcrições de Vídeos Online</title>
    <!-- Meta Tags para SEO -->
    <meta name="description" content="Transcreva vídeos do YouTube facilmente. Obtenha transcrições de vídeos em português e inglês de forma rápida e gratuita.">
    <meta name="keywords" content="transcrição de vídeos, YouTube, transcrição online, vídeo para texto, transcrição automática">
    <meta name="author" content="Seu Nome ou Nome da Empresa">
    <meta name="robots" content="index, follow">
    <!-- Open Graph Tags para redes sociais -->
    <meta property="og:title" content="Transcrição de Vídeos do YouTube - Obtenha Transcrições de Vídeos Online">
    <meta property="og:description" content="Transcreva vídeos do YouTube facilmente. Obtenha transcrições de vídeos em português e inglês de forma rápida e gratuita.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.seusite.com">
    <meta property="og:image" content="https://www.seusite.com/imagem.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        textarea {
            resize: none; /* Impede o redimensionamento da área de texto */
        }
        .btn-custom {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Transcrição de Vídeos do YouTube</h1>
        <div class="card shadow">
            <div class="card-body">
                <div class="mb-3">
                    <label for="url" class="form-label">Cole a URL do vídeo do YouTube:</label>
                    <input type="text" id="url" class="form-control" placeholder="Ex: https://www.youtube.com/watch?v=abcdef12345">
                </div>
                <div class="d-flex justify-content-between">
                    <button class="btn btn-primary btn-custom" onclick="transcribeVideo()">
                        <i class="bi bi-play-circle"></i> Obter Transcrição
                    </button>
                    <button class="btn btn-success btn-custom" onclick="copyText()">
                        <i class="bi bi-clipboard"></i> Copiar Texto
                    </button>
                </div>
                <div class="mt-4">
                    <label for="output" class="form-label">Transcrição:</label>
                    <textarea id="output" class="form-control" rows="10" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <!-- Script JavaScript -->
    <script>
        async function transcribeVideo() {
            const url = document.getElementById('url').value;
            const output = document.getElementById('output');
            output.value = "Processando...";

            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url }),
                });

                const data = await response.json();
                if (response.ok) {
                    output.value = data.transcript;
                } else {
                    output.value = data.error;
                }
            } catch (error) {
                output.value = "Erro ao conectar ao servidor.";
            }
        }

        function copyText() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            alert("Texto copiado para a área de transferência!");
        }
    </script>
</body>
</html>
